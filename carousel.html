<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Carousel</title>
    <style>
        @font-face {
            font-family: 'Orelo-sw-db';
            src: url(data:font/truetype;charset=utf-8;base64,T1RUTwAMAIAAAwBAQ0ZGICKM+QwAABCoAABdF0dERUYReRGAAABtwAAAAJpHUE9TnjkR0wAAblwAAD0AR1NVQlceV5QAAKtcAAAInE9TLzJpfoQNAAAG6AAAAGBjbWFwlYcGlAAADGAAAAQmaGVhZBKYJeUAAADUAAAANmhoZWEGmgVgAAAGxAAAACRobXR4D2gSMgAAAQwAAAW4bWF4cAFuUAAAAADMAAAABm5hbWUuNiedAAAHSAAABRVwb3N0/6IABwAAEIgAAAAg) format('truetype');
            font-weight: inherit;
            font-style: inherit;
        }

        .carousel-item {
            --items: 10;
            --width: clamp(150px, 30vw, 300px);
            --height: clamp(200px, 40vw, 400px);
            --active: calc(var(--offset) - var(--scroll-active));
            --x: calc(var(--active) * 800%);
            --y: calc(var(--active) * 200%);
            --rot: calc(var(--active) * 120deg);
            --opacity: calc(max(0, 1 - abs(var(--active)) * 2));
            overflow: hidden;
            position: absolute;
            z-index: var(--zIndex);
            width: var(--width);
            height: var(--height);
            margin: calc(var(--height) * -0.5) 0 0 calc(var(--width) * -0.5);
            border-radius: 10px;
            top: 50%;
            left: 50%;
            user-select: none;
            transform-origin: 0% 100%;
            box-shadow: 0 10px 50px 10px rgba(0, 0, 0, .5);
            background: black;
            pointer-events: all;
            transform: translate(var(--x), var(--y)) rotate(var(--rot));
        }

        .carousel-item:nth-child(1) { --offset: 0; }
        .carousel-item:nth-child(2) { --offset: 0.1; }
        .carousel-item:nth-child(3) { --offset: 0.2; }
        .carousel-item:nth-child(4) { --offset: 0.3; }
        .carousel-item:nth-child(5) { --offset: 0.4; }
        .carousel-item:nth-child(6) { --offset: 0.5; }
        .carousel-item:nth-child(7) { --offset: 0.6; }
        .carousel-item:nth-child(8) { --offset: 0.7; }
        .carousel-item:nth-child(9) { --offset: 0.8; }
        .carousel-item:nth-child(10) { --offset: 0.9; }

        .carousel-box {
            position: absolute;
            z-index: 1;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transition: opacity .8s cubic-bezier(0, 0.02, 0, 1);
            opacity: var(--opacity);
            font-family: 'Orelo-sw-db', serif;
        }

        .title {
            position: absolute;
            z-index: 1;
            color: #fff;
            bottom: 20px;
            left: 20px;
            transition: opacity .8s cubic-bezier(0, 0.02, 0, 1);
            font-size: clamp(20px, 3vw, 30px);
            text-shadow: 0 4px 4px rgba(0, 0, 0, .1);
        }

        .num {
            position: absolute;
            z-index: 1;
            color: #fff;
            top: 10px;
            left: 20px;
            transition: opacity .8s cubic-bezier(0, 0.02, 0, 1);
            font-size: clamp(20px, 10vw, 80px);
        }

        .carousel-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }

        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, black, rgb(34, 0, 51));
            font-family: Roboto, serif;
            overflow-x: hidden;
        }

        .carousel-container {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            --scroll-active: 0;
        }
    </style>
</head>
<body>
    <div class="carousel-container">
        <div class="carousel-item" style="--zIndex: 10;">
            <div class="carousel-box">
                <div class="title">Paris</div>
                <div class="num">01</div><img
                    src="https://media.istockphoto.com/id/949299844/it/foto/vista-prospettica-dellesterno-delledificio-contemporaneo.jpg?s=612x612&amp;w=0&amp;k=20&amp;c=_DR1aRHuTEV3EYBJo1ZXq1pF4SgwB9EVWQLaBj4sC5g="
                    alt="Paris">
            </div>
        </div>
        <div class="carousel-item" style="--zIndex: 9;">
            <div class="carousel-box">
                <div class="title">Warsaw</div>
                <div class="num">02</div><img
                    src="https://media.istockphoto.com/id/1150545984/it/foto/palazzo-moderno-di-lusso-con-piscina.jpg?s=612x612&amp;w=0&amp;k=20&amp;c=Pbrai_VGc9tUviMCF1UaBErdS1YGyIVWsD29jzMZwTY="
                    alt="Warsaw">
            </div>
        </div>
        <div class="carousel-item" style="--zIndex: 8;">
            <div class="carousel-box">
                <div class="title">Madrid</div>
                <div class="num">03</div><img
                    src="https://media.istockphoto.com/id/1214351345/it/foto/guardando-direttamente-lo-skyline-del-quartiere-finanziario-nel-centro-di-londra-immagine-di.jpg?s=612x612&amp;w=0&amp;k=20&amp;c=oNNbPzPvcQ-4RA6AeatNIxHQIafBiXmDRtUUY0Ska-I="
                    alt="Madrid">
            </div>
        </div>
        <div class="carousel-item" style="--zIndex: 7;">
            <div class="carousel-box">
                <div class="title">Sydney</div>
                <div class="num">04</div><img
                    src="https://media.istockphoto.com/id/904390980/it/foto/foto-di-architettura-contemporanea-astratta.jpg?s=612x612&amp;w=0&amp;k=20&amp;c=_P4Wmx5nq5MeDuimpNklKCBlrLovmCyd9lfiMKeJZDs="
                    alt="Sydney">
            </div>
        </div>
        <div class="carousel-item" style="--zIndex: 6;">
            <div class="carousel-box">
                <div class="title">Istanbul</div>
                <div class="num">05</div><img
                    src="https://media.istockphoto.com/id/130408311/it/foto/piscina-allesterno-della-casa-moderna-al-crepuscolo.jpg?s=612x612&amp;w=0&amp;k=20&amp;c=ZoVjx7uDjoHKmpM1ayW6UR1SQOoYh_xx-QMG_qeOYs0="
                    alt="Istanbul">
            </div>
        </div>
        <div class="carousel-item" style="--zIndex: 5;">
            <div class="carousel-box">
                <div class="title">Prague</div>
                <div class="num">06</div><img
                    src="https://media.istockphoto.com/id/1299954175/it/foto/villa-cubica-moderna.jpg?s=612x612&amp;w=0&amp;k=20&amp;c=DhGhb3c1E3DW_fbrWJ_R_Zh0Lbwu6syFeRLsKlZ9no8="
                    alt="Prague">
            </div>
        </div>
        <div class="carousel-item" style="--zIndex: 4;">
            <div class="carousel-box">
                <div class="title">Munich</div>
                <div class="num">07</div><img
                    src="https://media.istockphoto.com/id/926689776/it/foto/vista-ad-angolo-basso-dei-grattacieli-di-new-york.jpg?s=612x612&amp;w=0&amp;k=20&amp;c=DmEB0Ty7ZwDnBoU5SuA8FNevOp4G1UcECw5aS4vA9A8="
                    alt="Munich">
            </div>
        </div>
        <div class="carousel-item" style="--zIndex: 3;">
            <div class="carousel-box">
                <div class="title">Venice</div>
                <div class="num">08</div><img
                    src="https://media.istockphoto.com/id/1191376167/it/foto/villa-dellisola.jpg?s=612x612&amp;w=0&amp;k=20&amp;c=PKslWo4FdbjinohKQlK_oWL34jqAsnzMTdy2bxEAf-I="
                    alt="Venice">
            </div>
        </div>
        <div class="carousel-item" style="--zIndex: 2;">
            <div class="carousel-box">
                <div class="title">Oslo</div>
                <div class="num">09</div><img
                    src="https://media.istockphoto.com/id/184316397/it/foto/londra-edifici-aziendali.jpg?s=612x612&amp;w=0&amp;k=20&amp;c=XqrRxEPzFnwRFk7PQrCiu9-9jLEzWToYfdw46S8B0Mu0="
                    alt="Oslo">
            </div>
        </div>
        <div class="carousel-item" style="--zIndex: 1;">
            <div class="carousel-box">
                <div class="title">London</div>
                <div class="num">10</div><img
                    src="https://media.istockphoto.com/id/184619832/it/foto/distretto-finanziario-al-crepuscolo-londra.jpg?s=612x612&amp;w=0&amp;k=20&amp;c=RAThrJOBY6vhlT6-kQpu9-9jLEzWToYfdw46S8B0Mu0="
                    alt="London">
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script>
        gsap.registerPlugin(ScrollTrigger);

        gsap.to(".carousel-container", {
            "--scroll-active": 0.9,
            scrollTrigger: {
                trigger: ".carousel-container",
                start: "top top",
                end: "+=200%",
                scrub: true,
                pin: true
            }
        });
    </script>
</body>
</html>
