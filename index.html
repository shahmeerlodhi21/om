	<script>
		// GSAP animations for header elements
		gsap.from(".container", {
			duration: 1.5,
			y: -100,
			opacity: 0,
			ease: "power2.out"
		});

		gsap.from(".logo", {
			duration: 1,
			x: -50,
			opacity: 0,
			ease: "power2.out",
			delay: 0.5
		});

		gsap.from(".logo img", {
			duration: 2,
			rotation: 360,
			ease: "power2.out",
			delay: 1
		});

		gsap.from(".logo span", {
			duration: 1,
			y: 30,
			opacity: 0,
			ease: "power2.out",
			delay: 1.2
		});

		gsap.from("nav ul li", {
			duration: 0.8,
			y: 20,
			opacity: 0,
			ease: "power2.out",
			stagger: 0.1,
			delay: 1.5
		});

		gsap.from(".button", {
			duration: 1,
			scale: 0.8,
			opacity: 0,
			ease: "back.out(1.7)",
			delay: 2
		});

		// Hover animations for nav links
		document.querySelectorAll('nav ul li a').forEach(link => {
			link.addEventListener('mouseenter', () => {
				gsap.to(link, {
					duration: 0.3,
					scale: 1.2,
					color: '#fff',
					textShadow: '0 0 10px rgba(255, 255, 255, 0.8)',
					ease: "power2.out"
				});
			});

			link.addEventListener('mouseleave', () => {
				gsap.to(link, {
					duration: 0.3,
					scale: 1,
					color: '#b5a8d1',
					textShadow: 'none',
					ease: "power2.out"
				});
			});
		});

	// ========== ULTRA POWERFUL HERO BADGE ENTRANCE ==========
	const rotatingWords = [
		"Fully Automated",
		"Growth Focused",
		"Revenue Driven"
	];
	let currentWordIndex = 0;
	let charIndex = 0;
	let isDeleting = false;
	const rotatingTextEl = document.getElementById("rotating-text");

	// Initial fade in for heading
	gsap.from("#animated-heading", {
		duration: 1,
		y: 30,
		opacity: 0,
		ease: "power3.out",
		delay: 0.5
	});

	function typeWord() {
		const currentWord = rotatingWords[currentWordIndex];
		
		if (!isDeleting) {
			// Typing
			if (charIndex < currentWord.length) {
				rotatingTextEl.textContent = currentWord.substring(0, charIndex + 1);
				charIndex++;
				setTimeout(typeWord, 100);
			} else {
				// Finished typing, wait then start deleting
				isDeleting = true;
				setTimeout(typeWord, 2000);
			}
		} else {
			// Deleting
			if (charIndex > 0) {
				rotatingTextEl.textContent = currentWord.substring(0, charIndex - 1);
				charIndex--;
				setTimeout(typeWord, 50);
			} else {
				// Finished deleting, move to next word
				isDeleting = false;
				currentWordIndex = (currentWordIndex + 1) % rotatingWords.length;
				setTimeout(typeWord, 500);
			}
		}
	}

	setTimeout(typeWord, 1500);

	// ========== ULTRA POWERFUL PARAGRAPH ENTRANCE ==========
	const para = document.querySelector(".hero-content p");
	const paraText = para.textContent;
	
	// Split into characters
	para.innerHTML = paraText.split('').map((char, i) => 
		`<span class="para-char" style="--char-index: ${i}">${char === ' ' ? '&nbsp;' : char}</span>`
	).join('');
	
	const paraChars = para.querySelectorAll('.para-char');
	
	// Create explosion particles for each character
	paraChars.forEach((char, i) => {
		// Create 8 particles per character
		for(let p = 0; p < 8; p++) {
			const particle = document.createElement('span');
			particle.textContent = char.textContent;
			particle.style.cssText = `
				position: absolute;
				left: ${char.offsetLeft}px;
				top: ${char.offsetTop}px;
				color: rgba(255,105,180,0.8);
				pointer-events: none;
				font-size: inherit;
				z-index: 1000;
			`;
			para.appendChild(particle);
			
			const angle = (p * 45) * Math.PI / 180;
			gsap.timeline()
				.set(particle, {
					scale: 1,
					opacity: 1
				})
				.to(particle, {
					duration: 1.2,
					x: Math.cos(angle) * 150,
					y: Math.sin(angle) * 150,
					scale: 0,
					opacity: 0,
					rotation: 360,
					filter: 'blur(10px)',
					ease: "power3.out",
					delay: 1.5 + i * 0.02,
					onComplete: () => particle.remove()
				});
		}
	});
	
	// Main character entrance - ULTRA EXPLOSIVE
	paraChars.forEach((char, i) => {
		gsap.timeline()
			.from(char, {
				duration: 0.01,
				scale: 10,
				opacity: 0,
				filter: 'blur(40px) brightness(5)',
				rotation: 0
			})
			.to(char, {
				duration: 1,
				scale: 1,
				opacity: 1,
				filter: 'blur(0px) brightness(1)',
				rotation: 720,
				y: 0,
				ease: "elastic.out(1, 0.5)",
				delay: 1.5 + i * 0.02
			})
			.to(char, {
				duration: 0.3,
				scale: 1.3,
				filter: 'brightness(1.5) drop-shadow(0 0 10px rgba(255,105,180,1))',
				ease: "power2.out"
			}, "-=0.2")
			.to(char, {
				duration: 0.3,
				scale: 1,
				filter: 'brightness(1) drop-shadow(0 0 5px rgba(255,105,180,0.5))',
				ease: "back.in(2)"
			});
	});
	
	// Continuous wave animations
	function paraWaveEffect() {
		paraChars.forEach((char, i) => {
			gsap.timeline()
				.to(char, {
					y: -20,
					scale: 1.4,
					rotation: 10,
					color: '#ff69b4',
					textShadow: '0 0 20px #ff69b4, 0 0 40px #8a2be2',
					filter: 'brightness(1.8) drop-shadow(0 0 15px rgba(255,105,180,1))',
					duration: 0.5,
					delay: i * 0.05,
					ease: "power2.out"
				})
				.to(char, {
					y: 0,
					scale: 1,
					rotation: 0,
					color: 'rgba(255, 255, 255, 0.9)',
					textShadow: '0 0 8px rgba(255,105,180,0.6)',
					filter: 'brightness(1) drop-shadow(0 0 5px rgba(255,105,180,0.5))',
					duration: 0.5,
					ease: "bounce.out"
				});
		});
	}
	
	setInterval(paraWaveEffect, 4000);
	
	// Random character explosions
	setInterval(() => {
		const randomChar = paraChars[Math.floor(Math.random() * paraChars.length)];
		gsap.timeline()
			.to(randomChar, {
				scale: 2,
				rotation: 360,
				color: '#ffd700',
				textShadow: '0 0 30px #ffd700, 0 0 50px #ff69b4',
				filter: 'brightness(2.5) drop-shadow(0 0 25px rgba(255,215,0,1))',
				duration: 0.4,
				ease: "power2.out"
			})
			.to(randomChar, {
				scale: 1,
				rotation: 0,
				color: 'rgba(255, 255, 255, 0.9)',
				textShadow: '0 0 8px rgba(255,105,180,0.6)',
				filter: 'brightness(1) drop-shadow(0 0 5px rgba(255,105,180,0.5))',
				duration: 0.5,
				ease: "elastic.out(1, 0.5)"
			});
	}, 1000);		gsap.from(".hero-video", {
			duration: 1,
			y: 50,
			opacity: 0,
			scale: 0.95,
			ease: "power3.out",
			delay: 0.9
		});

		gsap.from(".cta-hero", {
			duration: 0.8,
			y: 30,
			opacity: 0,
			ease: "power3.out",
			delay: 1.2
		});

		// Subtle mouse parallax
		document.addEventListener('mousemove', (e) => {
			const x = (e.clientX / window.innerWidth - 0.5) * 20;
			const y = (e.clientY / window.innerHeight - 0.5) * 20;

			gsap.to(".hero-image", {
				x: x * 0.5,
				y: y * 0.5,
				duration: 1.5,
				ease: "power2.out"
			});

			gsap.to(".image-glow", {
				x: -x * 0.3,
				y: -y * 0.3,
				duration: 2,
				ease: "power2.out"
			});
		});

		// Advanced colorful particle network
		const canvas = document.getElementById('particle-canvas');
		const ctx = canvas.getContext('2d');
		canvas.width = window.innerWidth;
		canvas.height = window.innerHeight;

		const particles = [];
		const particleCount = 200;
		const colors = [
			{ r: 255, g: 105, b: 180 },  // Pink
			{ r: 138, g: 43, b: 226 },    // Purple
			{ r: 75, g: 0, b: 130 },      // Indigo
			{ r: 255, g: 20, b: 147 },    // Deep pink
			{ r: 148, g: 0, b: 211 }      // Dark violet
		];

		class Particle {
			constructor() {
				this.x = Math.random() * canvas.width;
				this.y = Math.random() * canvas.height;
				this.size = Math.random() * 3 + 1;
				this.speedX = Math.random() * 1 - 0.5;
				this.speedY = Math.random() * 1 - 0.5;
				this.color = colors[Math.floor(Math.random() * colors.length)];
				this.opacity = Math.random() * 0.6 + 0.3;
			}

			update() {
				this.x += this.speedX;
				this.y += this.speedY;

				if (this.x > canvas.width) this.x = 0;
				if (this.x < 0) this.x = canvas.width;
				if (this.y > canvas.height) this.y = 0;
				if (this.y < 0) this.y = canvas.height;
			}

			draw() {
				const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size);
				gradient.addColorStop(0, `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, ${this.opacity})`);
				gradient.addColorStop(1, `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, 0)`);
				ctx.fillStyle = gradient;
				ctx.beginPath();
				ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
				ctx.fill();
			}
		}

		for (let i = 0; i < particleCount; i++) {
			particles.push(new Particle());
		}

		function animate() {
			ctx.clearRect(0, 0, canvas.width, canvas.height);
			
			for (let i = 0; i < particles.length; i++) {
				particles[i].update();
				particles[i].draw();
				
				for (let j = i + 1; j < particles.length; j++) {
					const dx = particles[i].x - particles[j].x;
					const dy = particles[i].y - particles[j].y;
					const distance = Math.sqrt(dx * dx + dy * dy);
					
					if (distance < 150) {
						const opacity = 0.3 * (1 - distance / 150);
						const gradient = ctx.createLinearGradient(
							particles[i].x, particles[i].y,
							particles[j].x, particles[j].y
						);
						gradient.addColorStop(0, `rgba(${particles[i].color.r}, ${particles[i].color.g}, ${particles[i].color.b}, ${opacity})`);
						gradient.addColorStop(1, `rgba(${particles[j].color.r}, ${particles[j].color.g}, ${particles[j].color.b}, ${opacity})`);
						ctx.strokeStyle = gradient;
						ctx.lineWidth = 1;
						ctx.beginPath();
						ctx.moveTo(particles[i].x, particles[i].y);
						ctx.lineTo(particles[j].x, particles[j].y);
						ctx.stroke();
					}
				}
			}
			
			requestAnimationFrame(animate);
		}

		animate();

		window.addEventListener('resize', () => {
			canvas.width = window.innerWidth;
			canvas.height = window.innerHeight;
		});

		// Video play button functionality
		const playButton = document.querySelector('.play-button');
		const video = document.querySelector('.hero-video video');

		if (playButton && video) {
			playButton.addEventListener('click', () => {
				if (video.paused) {
					video.play();
					playButton.style.opacity = '0';
					playButton.style.pointerEvents = 'none';
				} else {
					video.pause();
					playButton.style.opacity = '0.8';
					playButton.style.pointerEvents = 'auto';
				}
			});

			video.addEventListener('ended', () => {
				playButton.style.opacity = '0.8';
				playButton.style.pointerEvents = 'auto';
			});
		}
	</script>
</body>

</html>
